version: 2

models:
  - name: brz_yellow_trips
    description: >
      Raw TLC rows for the pinned quarter, exactly as published. No filtering,
      casting, capping or renaming happens in bronze; every transformation is
      owned by slv_trips and slv_zones.
    columns:
      - name: VendorID
        tests:
          - not_null
      - name: tpep_pickup_datetime
        tests:
          - not_null
      - name: tpep_dropoff_datetime
        tests:
          - not_null
      - name: total_amount
        tests:
          - not_null
