version: 2

sources:
  - name: raw
    description: >
      Pinned TLC extracts for Q1 2024 (January to March), downloaded by
      scripts/download_data.py into data/raw/. Never committed: data/raw is in
      .gitignore. Column descriptions below are quoted verbatim from the TLC
      "Data Dictionary – Yellow Taxi Trip Records" (March 18, 2025),
      https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page. The 2024
      extracts carry 19 of the dictionary's 20 fields: cbd_congestion_fee
      (levied from Jan. 5, 2025) is absent, and the file spells airport_fee as
      Airport_fee.
    tables:
      - name: yellow_trips
        description: One row per yellow-taxi trip, as published by the TLC.
        meta:
          # One parquet per month, read together: bronze holds the whole quarter.
          external_location: "read_parquet('../data/raw/yellow_tripdata_2024-*.parquet')"
        columns:
          - name: VendorID
            description: |
              A code indicating the TPEP provider that provided the record.
              1 = Creative Mobile Technologies, LLC
              2 = Curb Mobility, LLC
              6 = Myle Technologies Inc
              7 = Helix
          - name: tpep_pickup_datetime
            description: The date and time when the meter was engaged.
          - name: tpep_dropoff_datetime
            description: The date and time when the meter was disengaged.
          - name: passenger_count
            description: The number of passengers in the vehicle.
          - name: trip_distance
            description: The elapsed trip distance in miles reported by the taximeter.
          - name: RatecodeID
            description: |
              The final rate code in effect at the end of the trip.
              1 = Standard rate
              2 = JFK
              3 = Newark
              4 = Nassau or Westchester
              5 = Negotiated fare
              6 = Group ride
              99 = Null/unknown
          - name: store_and_fwd_flag
            description: |
              This flag indicates whether the trip record was held in vehicle memory before
              sending to the vendor, aka “store and forward,” because the vehicle did not
              have a connection to the server.
              Y = store and forward trip
              N = not a store and forward trip
          - name: PULocationID
            description: TLC Taxi Zone in which the taximeter was engaged.
          - name: DOLocationID
            description: TLC Taxi Zone in which the taximeter was disengaged.
          - name: payment_type
            description: |
              A numeric code signifying how the passenger paid for the trip.
              0 = Flex Fare trip
              1 = Credit card
              2 = Cash
              3 = No charge
              4 = Dispute
              5 = Unknown
              6 = Voided trip
          - name: fare_amount
            description: |
              The time-and-distance fare calculated by the meter. For additional
              information on the following columns, see
              https://www.nyc.gov/site/tlc/passengers/taxi-fare.page
          - name: extra
            description: Miscellaneous extras and surcharges.
          - name: mta_tax
            description: Tax that is automatically triggered based on the metered rate in use.
          - name: tip_amount
            description: |
              Tip amount – This field is automatically populated for credit card tips. Cash
              tips are not included.
          - name: tolls_amount
            description: Total amount of all tolls paid in trip.
          - name: improvement_surcharge
            description: |
              Improvement surcharge assessed trips at the flag drop. The improvement
              surcharge began being levied in 2015.
          - name: total_amount
            description: The total amount charged to passengers. Does not include cash tips.
          - name: congestion_surcharge
            description: Total amount collected in trip for NYS congestion surcharge.
          - name: Airport_fee
            description: For pick up only at LaGuardia and John F. Kennedy Airports.
          # Dictionary field not present in the 2024 extracts:
          # cbd_congestion_fee - Per-trip charge for MTA's Congestion Relief Zone
          # starting Jan. 5, 2025.
      - name: zones
        description: TLC taxi zone lookup (LocationID to borough and zone name).
        meta:
          external_location: "read_parquet('../data/raw/taxi_zone_lookup.parquet')"
