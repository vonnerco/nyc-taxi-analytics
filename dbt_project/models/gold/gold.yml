version: 2

models:
  - name: gld_trip_summary
    description: >
      Headline KPIs. Grain: exactly one row (whole pinned quarter).
      Feeds the KPI strip; no chart aggregates on read.
    columns:
      - name: trips
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
      - name: tip_pct
        description: Fare-weighted tip percentage across all trips.
        tests:
          - not_null

  - name: gld_trips_daily
    description: >
      Trip volume over time, day grain. One row per pickup date.
      Feeds chart 1 when the grain selector is Day.
    columns:
      - name: pickup_date
        description: Date of pickup.
        tests:
          - not_null
          - unique
      - name: trip_count
        tests:
          - not_null
      - name: revenue
        description: Sum of total_amount for the day.
        tests:
          - not_null

  - name: gld_trips_weekly
    description: >
      Trip volume over time, week grain. One row per ISO week start (Monday).
      Feeds chart 1 when the grain selector is Week.
    columns:
      - name: week_start
        description: Monday of the ISO week.
        tests:
          - not_null
          - unique
      - name: trip_count
        tests:
          - not_null

  - name: gld_trips_by_dow
    description: >
      Volume by day of week. Grain: one row per ISO weekday (1 = Monday).
      Feeds chart 2.
    columns:
      - name: dow_iso
        description: ISO weekday, 1 = Monday through 7 = Sunday; the sort key.
        tests:
          - not_null
          - unique
      - name: day_name
        description: Weekday name derived from the pickup date.
        tests:
          - not_null
      - name: trip_count
        tests:
          - not_null

  - name: gld_trips_hourly
    description: >
      Demand curve, hour-of-day grain. One row per pickup hour (0-23), summed
      across the quarter. Feeds chart 1 when the grain selector is Hour.
    columns:
      - name: pickup_hour
        description: Hour of day, 0-23.
        tests:
          - not_null
          - unique
      - name: trip_count
        tests:
          - not_null

  - name: gld_revenue_by_zone
    description: >
      Revenue concentration by pickup zone. Grain: one row per pickup zone.
      Feeds chart 3; the chart takes the top N, the model keeps every zone.
    columns:
      - name: pickup_zone
        tests:
          - not_null
          - unique
      - name: total_revenue
        tests:
          - not_null
      - name: trip_count
        tests:
          - not_null
      - name: avg_fare
        description: Mean metered fare (before extras) for trips picked up in the zone.
        tests:
          - not_null

  - name: gld_payment_analysis
    description: >
      Payment mix and behaviour. Grain: one row per payment type label.
      Feeds chart 5 (payment mix) and chart 6 (payment behaviour).
    columns:
      - name: payment_type
        tests:
          - not_null
          - unique
      - name: trip_count
        tests:
          - not_null
      - name: trip_share_pct
        description: Share of trips in the quarter, percent of total.
        tests:
          - not_null
      - name: avg_fare
        description: Mean metered fare (before extras) for the payment type.
        tests:
          - not_null
      - name: tip_pct
        description: Fare-weighted tip percentage; cash is 0 because TLC records no cash tips.
        tests:
          - not_null

  - name: gld_tip_behavior
    description: >
      Fare-weighted tip percentage by distance bucket. Grain: one row per bucket.
      Feeds chart 4.
    columns:
      - name: distance_bucket
        tests:
          - not_null
          - unique
      - name: tip_pct
        tests:
          - not_null
  - name: gld_dashboard_facts
    description: >
      Shared fact cube for the interactive dashboard. Grain: one row per pickup
      date x hour x ISO weekday x pickup zone x payment type x distance bucket.
      The app filters this gold table and rolls it up to each chart grain so the
      KPI strip and all charts respond to the same selections.
    columns:
      - name: pickup_date
        tests:
          - not_null
      - name: pickup_hour
        description: Hour of day, 0-23.
        tests:
          - not_null
      - name: dow_iso
        description: ISO weekday, 1 = Monday through 7 = Sunday.
        tests:
          - not_null
      - name: pickup_zone
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
      - name: distance_bucket
        tests:
          - not_null
      - name: trip_count
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
      - name: fare_amount
        description: Sum of metered fares; denominator for fare-weighted tip rates.
        tests:
          - not_null
      - name: tip_amount
        description: Sum of recorded tips; numerator for fare-weighted tip rates.
        tests:
          - not_null
